<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e9d6bd"><title>Mystic Tarot | คำทำนายของคุณ</title><style>
*{box-sizing:border-box}body{margin:0;color:#4b3247;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(#e9d6cdbb,#d4b7d4c9),url('fantasy-bg.jpg') center/cover fixed;min-height:100vh}main{max-width:570px;margin:auto;padding:30px 17px 60px;text-align:center}.star{font-size:34px;color:#b67d36}.brand{font-family:Georgia,serif;font-style:italic;color:#835376;font-size:clamp(35px,9vw,52px);text-shadow:0 2px 2px #fff9}.subtitle{margin:8px 0 24px}.panel{border:3px double #bb945d;background:linear-gradient(135deg,#fffaf0f2,#f5e6d8f4);box-shadow:0 8px 30px #76596b55;border-radius:18px;padding:25px 18px;margin:15px auto}.label{font-size:13px;letter-spacing:2px;color:#946d65}.card-back,.card-front{margin:20px auto;width:min(58vw,230px);aspect-ratio:2/3.25;border:10px ridge #b68a53;border-radius:12px;box-shadow:0 10px 24px #6d547b55;display:flex;align-items:center;justify-content:center;flex-direction:column}.card-back{background:radial-gradient(circle,#7662a5,#29274e);color:#f6d9a2;font-size:65px;animation:flip .9s ease both}.card-front{background:linear-gradient(150deg,#f8e9ce,#e7cda5);color:#65476c;padding:12px;font-family:Georgia,serif}.card-front .sigil{font-size:65px}.card-front strong{font-size:21px;overflow-wrap:anywhere}h2{font-family:Georgia,serif;color:#82547c;margin:8px 0}h3{color:#855a67;margin:17px 0 5px;font-size:16px}p{line-height:1.75;margin:5px 0 10px}.note{font-size:12px;opacity:.8;margin-top:20px}.hidden{display:none}@keyframes flip{0%{transform:rotateY(0) scale(.85);opacity:.5}100%{transform:rotateY(360deg) scale(1);opacity:1}}.error{color:#a53e50}
</style></head><body><main><div class="star">✧</div><div class="brand">Mystic Tarot</div><p class="subtitle">คำทำนายที่รอคุณอยู่ในวันนี้</p><section class="panel"><div class="label">✦ ไพ่แห่งช่วงเวลานี้ ✦</div><div id="loading"><div class="card-back">✧</div><p>กำลังเปิดไพ่ของคุณ...</p></div><div id="reading" class="hidden"><div class="card-front" id="cardArt"><div class="sigil">✦</div><strong id="cardName"></strong><small>✧ MYSTIC TAROT ✧</small></div><h2 id="headline"></h2><h3>ภาพรวม</h3><p id="overview"></p><h3>การงาน</h3><p id="work"></p><h3>การเงิน</h3><p id="money"></p><h3>ความรัก</h3><p id="love"></p><h3>ข้อความจากไพ่</h3><p id="message"></p></div><p class="note">คำทำนายเพื่อการสะท้อนความคิดและความบันเทิง</p></section></main><script>
(async()=>{try{const response=await fetch('cards.json',{cache:'no-store'});if(!response.ok)throw Error('โหลดข้อมูลไพ่ไม่ได้');const cards=await response.json();const bytes=new Uint32Array(1);crypto.getRandomValues(bytes);const card=cards[bytes[0]%cards.length];const theme=card.theme;const set=(id,t)=>document.getElementById(id).textContent=t;set('cardName',card.name);set('headline',theme);set('overview',`ไพ่ใบนี้ชวนให้คุณใส่ใจกับ${theme} ลองมองสิ่งที่เกิดขึ้นอย่างรอบคอบและเลือกก้าวต่อไปในจังหวะของตัวเอง`);set('work',`ใช้พลังของ${theme}ในการจัดลำดับงาน เลือกสิ่งสำคัญก่อนและเปิดรับวิธีใหม่ ๆ`);set('money',`ทบทวนรายรับรายจ่ายก่อนตัดสินใจเรื่องใหญ่ ความรอบคอบจะช่วยให้คุณมั่นคงขึ้น`);set('love',`สื่อสารความรู้สึกอย่างตรงไปตรงมา พร้อมรับฟังอีกฝ่ายด้วยความเข้าใจ`);set('message',`“${theme} อาจเป็นกุญแจให้คุณมองเห็นโอกาสในวันนี้”`);setTimeout(()=>{document.getElementById('loading').classList.add('hidden');document.getElementById('reading').classList.remove('hidden')},1100)}catch(e){document.getElementById('loading').innerHTML='<p class="error">ไม่สามารถโหลดไพ่ได้ กรุณาลองเปิดหน้าเว็บอีกครั้ง</p>';console.error(e)}})();
</script></body></html>
